services:
  - type: web
    name: ai-email-generator-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: API_KEY
        sync: false
      - key: COHERE_API_KEY
        sync: false
      - key: API_PREFIX
        value: /api/v1
      - key: PROJECT_NAME
        value: "AI Email Generator API"
      - key: ALLOWED_ORIGINS
        value: "https://your-frontend.onrender.com,http://localhost:8501"
      - key: RATE_LIMIT
        value: "10 per minute"
